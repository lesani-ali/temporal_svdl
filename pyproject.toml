[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-svdl"
version = "0.1.0"
description = "Historical Google Street View downloader — fetches panoramas across multiple dates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ali Lesani" }]
keywords = [
    "google-street-view",
    "street-view",
    "temporal",
    "google-maps",
    "panorama",
    "temporal-imagery",
    "change-detection",
    "remote-sensing",
    "downloader",
    "urban-analytics",
    "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "poethepoet>=0.29",
]

[project.urls]
Homepage = "https://github.com/lesani-ali/temporal_svdl"
Documentation = "https://github.com/lesani-ali/temporal_svdl#readme"
"Bug Tracker" = "https://github.com/lesani-ali/temporal_svdl/issues"
"Source Code" = "https://github.com/lesani-ali/temporal_svdl"
Changelog = "https://github.com/lesani-ali/temporal_svdl/releases"

[project.scripts]
temporal-svdl = "temporal_svdl.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.poe.tasks]
test = "pytest --color=yes"
lint = "ruff check --fix src/ tests/"
format = "ruff format src/ tests/"
check = ["format", "lint", "test"]

[tool.ruff]
line-length = 100
target-version = "py310"
